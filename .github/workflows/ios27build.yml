name: peridot-iOS27-arm64e

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: Branch of hoshikv/xnu-kernel-peridot to build
        default: "ios27-arm64e-final"
      ios_sdk_version:
        description: iOS SDK version to use (16.5 available)
        default: "16.5"
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      machine_config:
        description: xnu MACHINE_CONFIG
        default: PERIDOT

concurrency:
  group: peridot-ios27-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@v4
        with:
          repository: hoshikv/xnu-kernel-peridot
          ref: ${{ inputs.kernel_branch || 'ios27-arm64e-final' }}
          submodules: recursive

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/share/swift /usr/local/.ghcup \
            /usr/local/share/powershell /usr/local/lib/node_modules \
            /usr/local/share/chromium /usr/local/share/edge /usr/share/az_* \
            /usr/local/share/boost
          sudo apt-get clean
          docker system prune -af || true
          df -h /

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git curl clang lld nasm \
            gcc-aarch64-linux-gnu llvm python3 python3-pip python3-venv uuid-dev \
            libtinfo6 flex bison m4 autoconf automake xz-utils libxml2-dev \
            libssl-dev pkg-config

      - name: Theos cctools + iOS ${{ inputs.ios_sdk_version }} SDK
        run: |
          export THEOS=$HOME/theos
          mkdir -p $THEOS/toolchain $THEOS/sdks
          curl -sL https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz \
            | tar -xJ -C $THEOS/toolchain
          url=$(curl -s https://api.github.com/repos/theos/sdks/releases/latest \
            | jq -r '.assets[] | select(.name=="iPhoneOS${{ inputs.ios_sdk_version }}.sdk.tar.xz") | .browser_download_url')
          if [ -z "$url" ] || [ "$url" = "null" ]; then
            echo "iOS ${{ inputs.ios_sdk_version }} SDK not found, falling back to iPhoneOS16.5.sdk.tar.xz"
            url=$(curl -s https://api.github.com/repos/theos/sdks/releases/latest \
              | jq -r '.assets[] | select(.name=="iPhoneOS16.5.sdk.tar.xz") | .browser_download_url')
          fi
          test -n "$url" && test "$url" != "null"
          echo "Downloading SDK from: $url"
          curl -sL "$url" | tar -xJ -C $THEOS/sdks
          test -x $THEOS/toolchain/linux/iphone/bin/ld
          test -d $THEOS/sdks/iPhoneOS${{ inputs.ios_sdk_version }}.sdk/usr/include
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "IOS_SDK=iPhoneOS${{ inputs.ios_sdk_version }}.sdk" >> $GITHUB_ENV

      - name: Apply patches & setup
        env:
          THEOS: ${{ env.THEOS }}
          IOS_SDK: ${{ env.IOS_SDK }}
        run: |
          mkdir -p out
          ./xnu/apply.sh
          ./xnu-deps/setup.sh
          touch out/.kernel-start

      - name: Build kernel
        env:
          THEOS: ${{ env.THEOS }}
          IOS_SDK: ${{ env.IOS_SDK }}
          MACHINE: PERIDOT
        run: |
          BUILD_STATUS=0
          ./xnu-build.sh -j"$(nproc)" -k > out/kernel-build.log 2>&1 || BUILD_STATUS=$?
          K=xnu-src/xnu-8796.121.2/BUILD/obj/DEVELOPMENT_ARM64E_PERIDOT/mach.development.peridot
          if ! test -s "$K" || ! test "$K" -nt out/.kernel-start || \
            ! grep -q "built kernel at .*mach.development.peridot" out/kernel-build.log || \
            grep -q 'error:' out/kernel-build.log; then
            tail -200 out/kernel-build.log
            exit 1
          fi
          if [ "$BUILD_STATUS" -ne 0 ]; then
            grep -q 'check_all_exports.*Error 1' out/kernel-build.log || {
              tail -200 out/kernel-build.log
              exit 1
            }
            echo "XNU's non-kernel symbolset audit failed after the kernel linked; using the verified new kernel"
          fi
          stat -c 'kernel: %s bytes' "$K"

      - name: Build WiFi firmware (ath11k, wlfw)
        run: |
          ./tools/mk-ath11k.sh
          ./tools/mk-wlfw.sh

      - name: Build hakios-metal
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nexec llvm-ar "$@"\n' > "$RUNNER_TEMP/bin/ar"
          chmod +x "$RUNNER_TEMP/bin/ar"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          export THEOS=$HOME/theos
          export IOS_CXX="xnu-clang++ -arch arm64e -isysroot $THEOS/sdks/iPhoneOS${{ inputs.ios_sdk_version }}.sdk -miphoneos-version-min=${{ inputs.ios_sdk_version }}"
          make -C metal test
          ./metal/build.sh

      - name: Mu-Silicium + peridot port
        run: ./uefi/apply.sh

      - name: Python environment
        run: |
          python3 -m venv venv
          venv/bin/pip install -r Mu-Silicium/pip-requirements.txt

      - name: Use system nasm for the Mu build
        run: |
          D=Mu-Silicium/Mu_Basecore/BaseTools/Bin/mu_nasm_extdep
          mkdir -p $D/Linux-x86-64
          echo 'version: 20016.1.1' > $D/extdep_state.yaml
          ln -sf /usr/bin/nasm $D/Linux-x86-64/nasm
          ln -sf /usr/bin/ndisasm $D/Linux-x86-64/ndisasm

      - name: Build UEFI
        run: |
          cd Mu-Silicium
          source ../venv/bin/activate
          python3 build_uefi.py -d peridot -r RELEASE

      - name: Build xnuloader
        run: ./xnuloader/build.sh

      - name: Pack boot image
        run: |
          mkdir -p out
          python3 xnuloader/mkpayload.py -o out/usb-payload.bin loader.efi=xnuloader/loader.efi --usb
          FD_BASE=0xA7100000 FD_SIZE=0x300000 PAYLOAD_BASE=0xF0000000 \
          UEFI_FD=Mu-Silicium/Build/peridotPkg/RELEASE_CLANGPDB/FV/SILICIUM_UEFI.fd \
          DTB=uefi/files/Resources/DTBs/peridot.dtb UEFI_TARGET=peridot \
          python3 mkxnuimg.py -p out/usb-payload.bin -o out/peridot-ios27-boot.img

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: peridot-ios27-arm64e
          path: |
            out/peridot-ios27-boot.img
            out/kernel-build.log
            xnuloader/loader.efi
            xnu-src/xnu-8796.121.2/BUILD/obj/DEVELOPMENT_ARM64E_PERIDOT/mach.development.peridot
            metal/out/ios/hakios-metal-probe
            metal/out/ios/libhakios-metal.a
            Mu-Silicium/Build/peridotPkg/RELEASE_CLANGPDB/FV/SILICIUM_UEFI.fd
            devices/peridot/prebuilt/peridot.dtb
            devices/peridot/prebuilt/BootShim.bin
          retention-days: 30
